<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masjid E Raza - Saving For Moharam</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #ffffff; min-height: 100vh; padding: 1.5rem 0.8rem; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2.2rem; font-weight: 700; background: linear-gradient(45deg, #ffd700, #ffa500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header h2 { font-size: 1.1rem; color: #e0e0e0; font-weight: 300; }
        .top-bar { width: 100%; max-width: 1100px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 10px; }
        .admin-status { font-size: 0.85rem; padding: 6px 12px; border-radius: 20px; background: rgba(255, 255, 255, 0.1); }
        .controls { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { background: linear-gradient(45deg, #00b4db, #0083b0); border: none; color: white; padding: 8px 14px; font-size: 0.85rem; font-weight: 600; border-radius: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.3s ease; }
        .btn-gold { background: linear-gradient(45deg, #ffd700, #ffa500); color: #000; }
        .btn-admin { background: #e11d48; }
        .admin-only { display: none; }
        .stats-card { width: 100%; max-width: 1100px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 1rem; margin-bottom: 1.5rem; text-align: center; }
        .stats-card h3 { font-size: 1.8rem; color: #00ff88; }
        .container { width: 100%; max-width: 1100px; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 1rem; overflow: hidden; margin-bottom: 2rem; }
        .table-wrapper { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
        th, td { padding: 0.8rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.9rem; }
        th { color: #ffd700; text-transform: uppercase; font-size: 0.75rem; }
        .text-red { color: #ff4d4d; font-weight: 600; }
        .text-green { color: #00ff88; font-weight: 600; }
        .qr-section { width: 100%; max-width: 1100px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 1.8rem 1rem; text-align: center; margin-top: auto; }
        .qr-card { background: #ffffff; padding: 15px; border-radius: 20px; display: inline-block; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .qr-card img { width: 320px; max-width: 85vw; height: auto; object-fit: contain; display: block; border-radius: 12px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 100; padding: 1rem; }
        .modal-content { background: #1a2634; padding: 1.5rem; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #ccc; }
        .form-group input, .form-group select { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #334e68; background: #0f172a; color: white; font-size: 0.95rem; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 1.2rem; }
        .btn-cancel { background: #475569; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Masjid E Raza</h1>
        <h2>Saving For Moharam</h2>
    </div>

    <div class="top-bar">
        <div class="admin-status" id="adminStatus">Public View</div>
        <div class="controls">
            <button class="btn btn-admin" id="authBtn" onclick="toggleAdmin()">🔒 Admin</button>
            <button class="btn btn-gold admin-only" onclick="openModal('addMemberModal')">➕ Add</button>
            <button class="btn admin-only" onclick="openModal('payModal')">💵 Update</button>
        </div>
    </div>

    <div class="stats-card">
        <p style="color:#aaa; font-size: 0.9rem;">Total Recieved Amount</p>
        <h3 id="grandTotal">₹0</h3>
    </div>

    <div class="container">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Member Name</th>
                        <th>Recieved</th>
                        <th>Target</th>
                        <th>Pending Amount</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="4" style="text-align:center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="qr-section">
        <h3 style="color:#ffd700; font-size:1.3rem; margin-bottom:0.5rem;">Online Payment / QR Code</h3>
        <p style="color:#ccc; font-size:0.9rem; margin-bottom:1.2rem;">Scan to pay your monthly saving (₹100 / ₹1200)</p>
        <div class="qr-card">
            <img src="https://i.ibb.co/zhkqb2YH/IMG-20260827-WA0015-1.jpg" alt="Payment QR Code">
        </div>
    </div>

    <!-- Modals -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h3 style="color:#ffd700; margin-bottom:1.2rem;">Admin Authorization</h3>
            <div class="form-group">
                <label>Enter Master Password</label>
                <input type="password" id="adminPassword" placeholder="Enter password">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal('loginModal')">Cancel</button>
                <button class="btn btn-gold" onclick="verifyPassword()">Login</button>
            </div>
        </div>
    </div>

    <div class="modal" id="addMemberModal">
        <div class="modal-content">
            <h3 style="color:#ffd700; margin-bottom:1.2rem;">Add New Member</h3>
            <div class="form-group">
                <label>Member Name</label>
                <input type="text" id="newMemberName" placeholder="Enter full name">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal('addMemberModal')">Cancel</button>
                <button class="btn btn-gold" onclick="addMember()">Save</button>
            </div>
        </div>
    </div>

    <div class="modal" id="payModal">
        <div class="modal-content">
            <h3 style="color:#ffd700; margin-bottom:1.2rem;">Add Payment Entry</h3>
            <div class="form-group">
                <label>Select Member</label>
                <select id="memberSelect"></select>
            </div>
            <div class="form-group">
                <label>Select Month / Mode</label>
                <select id="monthSelect">
                    <option value="FULL">Full 1 Year (₹1200)</option>
                    <option value="Jan">January (₹100)</option>
                    <option value="Feb">February (₹100)</option>
                    <option value="Mar">March (₹100)</option>
                    <option value="Apr">April (₹100)</option>
                    <option value="May">May (₹100)</option>
                    <option value="Jun">June (₹100)</option>
                    <option value="Jul">July (₹100)</option>
                    <option value="Aug">August (₹100)</option>
                    <option value="Sep">September (₹100)</option>
                    <option value="Oct">October (₹100)</option>
                    <option value="Nov">November (₹100)</option>
                    <option value="Dec">December (₹100)</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal('payModal')">Cancel</button>
                <button class="btn" onclick="submitPayment()">Submit</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwXkSe6Xu46_fMXwPPGgGNf3heVC0NYpL-EuqCZOCywnZt7ZWGLaV2mVA6gvQ0xrYzB/exec";
        const ADMIN_PASS = "Yakubkhan";
        let isAdmin = false;
        let currentData = [];

        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                currentData = await res.json();
                renderTable();
            } catch(e) { console.error(e); }
        }

        function renderTable() {
            const tableBody = document.getElementById("tableBody");
            const memberSelect = document.getElementById("memberSelect");
            tableBody.innerHTML = "";
            memberSelect.innerHTML = "";
            let grandTotal = 0;
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

            currentData.forEach((row, idx) => {
                let total = 0;
                months.forEach(m => total += Number(row[m] || 0));
                grandTotal += total;

                let pending = 1200 - total;
                let pendingDisplay = pending <= 0 ? `<span class="text-green">₹0 (Completed)</span>` : `<span class="text-red">₹${pending}</span>`;

                tableBody.innerHTML += `
                    <tr>
                        <td><strong>${row.Name}</strong></td>
                        <td>₹${total}</td>
                        <td>₹1200</td>
                        <td>${pendingDisplay}</td>
                    </tr>
                `;
                memberSelect.innerHTML += `<option value="${row.Name}">${row.Name}</option>`;
            });
            document.getElementById("grandTotal").innerText = `₹${grandTotal}`;
        }

        async function addMember() {
            const nameInput = document.getElementById("newMemberName");
            const name = nameInput.value.trim();
            if(!name) return alert("Naam likhna zaroori hai!");

            const newObj = { Name: name, Jan:0, Feb:0, Mar:0, Apr:0, May:0, Jun:0, Jul:0, Aug:0, Sep:0, Oct:0, Nov:0, Dec:0 };
            currentData.push(newObj);
            renderTable();
            closeModal('addMemberModal');
            nameInput.value = "";

            fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "ADD", Name: name })
            });
        }

        async function submitPayment() {
            const name = document.getElementById("memberSelect").value;
            const mode = document.getElementById("monthSelect").value;
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

            let person = currentData.find(p => p.Name === name);
            if(person) {
                if(mode === "FULL") {
                    months.forEach(m => person[m] = 100);
                } else {
                    person[mode] = 100;
                }
            }
            renderTable();
            closeModal('payModal');

            fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "UPDATE", Name: name, mode: mode })
            });
        }

        function toggleAdmin() {
            if(isAdmin) {
                isAdmin = false;
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
                document.getElementById('adminStatus').innerText = "Public View";
                document.getElementById('authBtn').innerText = "🔒 Admin";
                document.getElementById('authBtn').style.background = "#e11d48";
            } else { openModal('loginModal'); }
        }

        function verifyPassword() {
            const input = document.getElementById('adminPassword').value;
            if(input === ADMIN_PASS) {
                isAdmin = true;
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'inline-block');
                document.getElementById('adminStatus').innerText = "Admin Unlocked 🔓";
                document.getElementById('authBtn').innerText = "🚪 Logout";
                document.getElementById('authBtn').style.background = "#10b981";
                closeModal('loginModal');
                document.getElementById('adminPassword').value = "";
            } else { alert("Incorrect Password!"); }
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        fetchData();
    </script>
</body>
</html>
